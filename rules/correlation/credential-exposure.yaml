id: credential-exposure
name: Credential exposure risk
description: >-
  Targets were identified by email harvesting and a credential-capture vector
  (reflected XSS or a phishing surface) exists — a plausible path to credential
  theft.
severity: medium
mitre: [TA0043, TA0006]
match:
  all_of:
    - sources: ["osint.email_harvest", "osint.email*"]
    - sources: ["webscanner.xss", "phishing.*", "phishing"]
